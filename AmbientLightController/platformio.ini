; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32.git ; provides the required ESP32 Core for Arduino 3.x instead of officially supported 2.x by pio
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = fastled/FastLED@^3.7.0
monitor_speed= 115200

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_TINYUSB_CDC_ENABLED=1
  -DCONFIG_TINYUSB_ENABLED=1

upload_speed = 921600
upload_protocol = esptool
monitor_filters = esp32_exception_decoder, default
build_type=debug

[env:client_ecu]
build_flags = ${env.build_flags} -DCLIENT

[env:server_ecu]
build_flags = ${env.build_flags} -DSERVER
